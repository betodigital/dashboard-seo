{% load static %}
<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acesso Bloqueado — {{ system_name }}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}"/>
</head>
<body>
<div class="auth-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="auth-wrapper">
    <div class="auth-card" style="text-align:center">
      <div style="font-size:3rem;margin-bottom:1rem">🔒</div>
      <h1 style="color:var(--red);margin-bottom:.5rem">Acesso Bloqueado</h1>
      <p style="color:var(--text2);margin-bottom:1.5rem">
        Muitas tentativas de login incorretas.<br>
        Tente novamente em <strong>1 hora</strong>.
      </p>
      <p style="font-size:.8rem;color:var(--text3)">
        Se você acredita que isso é um erro, contate o administrador do sistema.
      </p>
    </div>
  </div>
</div>
</body>
</html>
