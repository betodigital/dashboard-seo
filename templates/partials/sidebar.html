<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <svg width="28" height="28" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="10" fill="url(#sb-g1)"/>
      <path d="M20 8L32 14V26L20 32L8 26V14L20 8Z" fill="white" fill-opacity="0.9"/>
      <path d="M20 14L26 17V23L20 26L14 23V17L20 14Z" fill="url(#sb-g2)"/>
      <defs>
        <linearGradient id="sb-g1" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
          <stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a78bfa"/>
        </linearGradient>
        <linearGradient id="sb-g2" x1="14" y1="14" x2="26" y2="26" gradientUnits="userSpaceOnUse">
          <stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a78bfa"/>
        </linearGradient>
      </defs>
    </svg>
    <span>{{ system_name }}</span>
  </div>

  <nav class="sidebar-nav">
    {% if perms_map.dashboard %}
    <a href="{% url 'dashboard' %}" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span>Dashboard</span>
    </a>
    {% endif %}

    {% if perms_map.reports %}
    <a href="{% url 'reports' %}" class="nav-item {% if active_page == 'reports' %}active{% endif %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 20V10M12 20V4M6 20v-6"/>
      </svg>
      <span>Relatórios</span>
    </a>
    {% endif %}

    {% if perms_map.settings %}
    <a href="{% url 'settings' %}" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.07 4.93l-1.41 1.41M4.93 4.93l1.41 1.41M19.07 19.07l-1.41-1.41M4.93 19.07l1.41-1.41M21 12h-2M5 12H3M12 19v2M12 3v2"/>
      </svg>
      <span>Configurações</span>
    </a>
    {% endif %}

    {% if perms_map.users %}
    <a href="{% url 'users_list' %}" class="nav-item {% if active_page == 'users' %}active{% endif %}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
        <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span>Usuários</span>
    </a>
    {% endif %}
  </nav>

  <!-- Tema (mobile) -->
  <div class="sidebar-theme">
    <span class="sidebar-theme-label">Tema</span>
    <div class="theme-switcher">
      <button class="theme-btn" data-theme="light" title="Claro">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
      <button class="theme-btn" data-theme="dark" title="Escuro">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="theme-btn" data-theme="system" title="Sistema">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </button>
    </div>
  </div>

  <form method="post" action="{% url 'logout' %}" class="sidebar-footer">
    {% csrf_token %}
    <button type="submit" class="btn-logout">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Sair</span>
    </button>
  </form>
</aside>
