{% extends 'base.html' %}
{% block title %}Redefinir Senha — {{ system_name }}{% endblock %}

{% block content %}
<div class="auth-bg">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="auth-wrapper">
    <div class="auth-card">

      <div class="auth-header">
        <div class="auth-logo">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="12" fill="url(#grad)"/>
            <path d="M20 8L32 14V26L20 32L8 26V14L20 8Z" fill="white" fill-opacity="0.9"/>
            <path d="M20 14L26 17V23L20 26L14 23V17L20 14Z" fill="url(#grad2)"/>
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
              <linearGradient id="grad2" x1="14" y1="14" x2="26" y2="26" gradientUnits="userSpaceOnUse">
                <stop stop-color="#6c63ff"/><stop offset="1" stop-color="#a78bfa"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1>Redefinir Senha</h1>
        <p>Digite seu e-mail para receber o link de redefinição</p>
      </div>

      <form method="post" class="auth-form" novalidate>
        {% csrf_token %}
        <div class="form-group">
          <label for="id_email">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            E-mail
          </label>
          <input
            type="email"
            id="id_email"
            name="email"
            placeholder="Digite seu e-mail"
            required
            autocomplete="email"
            autofocus
          />
        </div>

        <button type="submit" class="btn-primary">
          <span>Enviar Link</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </form>

      <div class="auth-footer-link">
        <a href="{% url 'login' %}">← Voltar para o login</a>
      </div>

    </div>
  </div>
</div>
{% endblock %}
